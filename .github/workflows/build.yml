name: Build Executables (Mac, Windows, Linux)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: TwitchBot-Linux
          - os: windows-latest
            artifact_name: TwitchBot-Windows
          - os: macos-latest
            artifact_name: TwitchBot-macOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name "TwitchBot-Windows-GUI" --icon "icon.ico" --add-data "icon.ico;." --add-data "icon.png;." --add-data "proxies.txt;." main_gui.py
          pyinstaller --noconfirm --clean --onefile --console --name "TwitchBot-Windows-CLI" --icon "icon.ico" main.py

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist && zip -r TwitchBot-Mac-GUI.zip TwitchBot-Mac-GUI.app

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/TwitchBot-Linux-*
            dist/TwitchBot-Mac-CLI
            dist/TwitchBot-Mac-GUI.zip
